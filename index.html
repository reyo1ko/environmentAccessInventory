<div class="section-head"><div><h2 class="text-lg font-bold" id="view-title"></h2><p class="muted text-xs mt-1" id="view-help"></p></div><div class="actions"><span class="save-status" id="save-status">保存済み</span><button class="btn small management" id="category-edit" hidden>環境名を変更</button><button class="btn small management" id="add-route">＋ 経路を追加</button></div></div>

</main></div>
<dialog id="editor"><form id="edit-form"><div class="dialog-head"><h2 class="text-lg font-bold" id="dialog-title"></h2><button type="button" class="btn small" id="close-dialog" aria-label="閉じる">✕</button></div><div class="form-body" id="form-body"></div><div class="dialog-foot"><button type="button" class="btn" id="cancel-dialog">キャンセル</button><button type="submit" class="btn primary">保存する</button></div></form></dialog>
<dialog id="account-detail"><div class="dialog-head"><h2 class="text-lg">接続先の詳細</h2><button type="button" class="btn" id="detail-close" aria-label="詳細を閉じる">✕</button></div><div class="form-body detail-body" id="detail-body"></div></dialog>

 const direct=roots.length>0&&roots.every(n=>!n.children.length);
 const tone='environment-tone-'+data.categories.indexOf(env);
 return '<details class="environment '+tone+' '+(direct?'direct-environment':'')+'" data-environment="'+esc(env)+'" '+(closedEnvironments.has(env)?'':'open')+'><summary class="environment-heading"><h3>'+esc(env)+'</h3><span class="environment-count">'+data.accounts.filter(a=>a.category===env).length+'件</span><button type="button" class="btn small management environment-add" data-add-in-environment="'+esc(env)+'" aria-label="'+esc(env)+'に接続先を追加">＋ 接続先を追加</button></summary><div class="environment-content">'+(!roots.length&&!unassigned.length?'<p class="environment-empty">接続先を追加してください。接続元は後から設定できます。</p>':'')+(levels.length?'<div class="route-map"><svg class="route-wires" data-marker="wire-arrow-'+data.categories.indexOf(env)+'" aria-hidden="true"></svg>'+treeNodeMarkup({id:null,path:[],children:roots},env)+'</div>':'')+(unassigned.length?'<div class="unassigned"><h4>経路未設定</h4><div class="access-cards">'+unassigned.map(a=>diagramCard(a,[])).join('')+'</div></div>':'')+'</div></details>';
}
function openBranch(index){
 const branch=branchTargets[index];if(!branch)return;
 const choices=data.accounts.filter(a=>!branch.steps.includes(a.id));if(!choices.length){toast('先に新しい接続先を登録してください');return;}
 editing={kind:'branch',branch};
 $('#dialog-title').textContent='接続先をつなぐ';
 $('#form-body').innerHTML='<p class="connection-context">'+esc(branch.category)+'：'+branch.steps.map(id=>esc(data.accounts.find(a=>a.id===id).name)).join(' → ')+' → 追加する接続先</p><label>接続先<select class="input" name="target" required>'+choices.map(a=>'<option value="'+esc(a.id)+'">'+esc(a.name)+' / '+esc(a.category)+'</option>').join('')+'</select></label><label>接続時のメモ<textarea class="input" name="note" rows="2"></textarea></label>';
 $('#editor').showModal();
}
function addBranch(branch,target,note){
 if(!data.accounts.some(a=>a.id===target)||branch.steps.includes(target))throw Error('接続先を確認してください');
 const steps=[...branch.steps,target];
 if(data.routes.some(r=>r.category===branch.category&&steps.every((id,i)=>r.steps[i]===id)))return false;
 data.routes.push({id:crypto.randomUUID(),name:data.accounts.find(a=>a.id===target).name,category:branch.category,steps,note});return true;
}
function render(){
 $('#workspace').classList.toggle('editing-mode',editMode);
 category='';const rs=data.routes;
 $('#view-title').textContent='すべての接続先';$('#view-help').textContent='各行のボタンでコピー ／ 名前をクリックすると詳細';
 $('#category-edit').hidden=false;$('#add-route').hidden=false;
 branchTargets=[];
 const envs=data.categories;
 const moveStatus=$('#move-status');if(moveUndo&&JSON.stringify(data.routes)!==moveUndo.after)moveUndo=null;moveStatus.hidden=!moveUndo;moveStatus.innerHTML=moveUndo?'接続元を変更しました <button class="btn small" data-undo-move>元に戻す</button>':'';
 const management=editMode?'<details class="path-maintenance" id="advanced-routes"><summary>経路の詳細設定</summary>'+rs.map(r=>'<div class="route-line"><span>'+r.steps.map(id=>esc(data.accounts.find(a=>a.id===id).name)).join(' → ')+'</span><button class="btn small" data-edit-route="'+esc(r.id)+'">編集</button><button class="btn small danger" data-delete-route="'+esc(r.id)+'">削除</button></div>').join('')+'</details>':'';
 const addRouteButton=$('#add-route');$('#content').innerHTML=(editMode?'<div class="drag-help">カードを接続元にしたいカードへドラッグ（同じ環境内・後続も移動）<div class="root-drop" data-drop-root>手元のPCへ直接つなぐ：ここにドロップ</div></div>':'')+envs.map(environmentView).join('')+management||'<div class="empty">接続先を追加してください。</div>';if(editMode)$('#advanced-routes').append(addRouteButton);else $('.section-head .actions').append(addRouteButton);scheduleWires();if(typeof ResizeObserver==='function'){if(!wireObserver)wireObserver=new ResizeObserver(scheduleWires);wireObserver.disconnect();document.querySelectorAll('.route-map').forEach(map=>wireObserver.observe(map));} 

}
function options(list,value){return list.map(x=>`<option value="${esc(x)}" ${x===value?'selected':''}>${esc(x)}</option>`).join('');}
function input(name,label,value='',full=false,type='text'){return `<label class="${full?'full':''}">${label}<input class="input" name="${name}" type="${type}" value="${esc(value)}" ${name==='name'?'required':''}></label>`;}
function openEditor(kind,id,environment){editing={kind,id};const a=(kind==='account'?data.accounts:data.routes).find(x=>x.id===id)||{category:environment||data.categories[0]||'',protocol:'RDP',steps:[]};$('#dialog-title').textContent=(kind==='account'?'接続先':'接続経路')+(id?'を編集':'を追加');$('#form-body').innerHTML=`<div class="form-grid">${input('name',kind==='account'?'接続先名 *':'用途・経路名 *',a.name,true)}<label>カテゴリ<select name="category" class="input">${options(!id&&environment?[environment]:data.categories,a.category)}</select></label>${kind==='account'?`<label>接続方式<select name="protocol" class="input">${options(['RDP','SSH','Web','VPN','その他'],a.protocol)}</select></label>${input('host','ホスト名',a.host)}${input('ip','IPアドレス',a.ip)}${input('url','URL',a.url,true)}<section class="full"><h3 class="text-sm">アカウント</h3><div id="credential-rows">${credentialsOf(a).map(credentialEditorRow).join('')}</div><button type="button" class="btn small" data-add-login>＋ アカウントを追加</button></section>`:`<div class="full"><label>接続する順番 *</label><p class="muted text-xs mt-2">登録済みの接続先を選び、↑ ↓で順番を変更できます。</p><div id="route-steps"></div><button class="btn small mt-2" type="button" id="step-add">＋ ステップを追加</button></div>`}<label class="full">メモ<textarea class="input" name="note" rows="3">${esc(a.note||'')}</textarea></label></div>`;if(kind==='account'&&id){$('#form-body .form-grid').insertAdjacentHTML('afterbegin','<label class="full">接続元<select class="input" name="source">'+sourceOptions(id)+'</select><p class="source-help">手元のPC、または既存の接続経路を選択します。変更すると、この接続先以降の経路も新しい接続元につなぎ直します。</p></label>');}if(kind==='account')simplifyAccountForm();if(kind==='route'){(a.steps.length?a.steps:[data.accounts[0]?.id]).filter(Boolean).forEach(addStep);}$('#editor').showModal();}
function credentialEditorRow(c={id:crypto.randomUUID(),account:'',username:'',password:''}){return '<div class="credential-editor"><input type="hidden" name="credential-id" value="'+esc(c.id)+'">'+input('credential-account','アカウント',c.account)+input('credential-username','ログイン名',c.username)+input('credential-password','パスワード',c.password,false,'password')+'<button type="button" class="btn small" data-toggle-login-password>表示</button><button type="button" class="btn small danger" data-remove-login>削除</button></div>';}
function readCredentials(f){const ids=f.getAll('credential-id');if(!ids.length)return [{id:'login-1',account:f.get('account')||'',username:f.get('username')||'',password:f.get('password')||''}];return ids.map((id,i)=>({id,account:f.getAll('credential-account')[i]||'',username:f.getAll('credential-username')[i]||'',password:f.getAll('credential-password')[i]||''}));}
function simplifyAccountForm(){
 const grid=$('#form-body .form-grid');const details=document.createElement('details');details.className='full optional-fields';details.innerHTML='<summary>補足情報（ホスト名・メモ）</summary><div class="form-grid"></div>';grid.append(details);
 for(const name of ['host','note'])details.querySelector('.form-grid').append(grid.querySelector('[name="'+name+'"]').closest('label'));
 const sync=()=>{const web=grid.querySelector('[name="protocol"]').value==='Web';grid.querySelector('[name="url"]').closest('label').hidden=!web;grid.querySelector('[name="ip"]').closest('label').hidden=web;};grid.querySelector('[name="protocol"]').addEventListener('change',sync);sync();
}
function addStep(id){const row=document.createElement('div');row.className='editor-step';row.innerHTML=`<select class="input" name="step" aria-label="経路の接続先" required>${data.accounts.map(a=>`<option value="${esc(a.id)}" ${a.id===id?'selected':''}>${esc(a.name)} — ${esc(a.category)}</option>`).join('')}</select><button type="button" class="btn small" data-move="up" aria-label="前に移動">↑</button><button type="button" class="btn small" data-move="down" aria-label="後ろに移動">↓</button><button type="button" class="btn small danger" data-remove-step aria-label="ステップを削除">×</button>`;$('#route-steps').append(row);}
async function copy(t,a,key,credential){
 if(!t){toast('コピーする値がありません');return;}
 const attempt=++copySequence;
 try{await navigator.clipboard.writeText(t);}catch{
  const focused=document.activeElement,el=document.createElement('textarea');el.value=t;el.style.cssText='position:fixed;opacity:0';document.body.append(el);el.select();let ok=false;
  try{ok=document.execCommand('copy');}catch{}finally{el.remove();focused?.focus();}
  if(!ok){toast('コピーできませんでした。表示した値を選択してコピーしてください。');return;}
 }
 if(attempt!==copySequence)return;
 lastCopied=a.id+':'+key+(credential?':'+credential.id:'');
 const labels={ip:'IP',host:'ホスト名',url:'URL',account:'アカウント',username:'ログイン名',password:'パスワード',target:'接続先'};
 const message=a.category+' / '+a.name+(credential?' / '+(credential.account||credential.username||'アカウント'):'')+'：'+labels[key]+'をコピーしました';
 $('#copy-status').textContent=message;
 document.querySelectorAll('[data-copy]').forEach(b=>{const active=b.dataset.copy+':'+b.dataset.field+(b.dataset.login?':'+b.dataset.login:'')===lastCopied;b.classList.toggle('copied',active);b.querySelector('.copy-mark').innerHTML=active?'✓':copyIcon;});
 toast(message);
}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if('addLoginTo'in d){$('#account-detail').close();openEditor('account',d.addLoginTo);$('#credential-rows').insertAdjacentHTML('beforeend',credentialEditorRow());return;}if('addLogin'in d){$('#credential-rows').insertAdjacentHTML('beforeend',credentialEditorRow());return;}if('removeLogin'in d){if($('#credential-rows').children.length===1){toast('アカウントは1件以上必要です');return;}b.closest('.credential-editor').remove();return;}if('toggleLoginPassword'in d){const field=b.closest('.credential-editor').querySelector('[name="credential-password"]');field.type=field.type==='password'?'text':'password';b.textContent=field.type==='password'?'表示':'隠す';return;}if('addInEnvironment'in d){e.preventDefault();if(data.categories.includes(d.addInEnvironment)){closedEnvironments.delete(d.addInEnvironment);render();openEditor('account',undefined,d.addInEnvironment);}return;}if('detailBranch'in d){const a=data.accounts.find(a=>a.id===detailAccount);const index=branchTargets.push({category:a.category,steps:detailPath})-1;$('#account-detail').close();openBranch(index);}if('undoMove'in d)undoMove();if(d.detail&&Date.now()>=dragSuppressedUntil)showDetail(d.detail,JSON.parse(d.path));if('branch'in d)openBranch(Number(d.branch));if('clearRoute'in d){selectedRoute='';render();}if(d.selectRoute){selectedRoute=selectedRoute===d.selectRoute?'':d.selectRoute;render();}if(d.copy){const a=data.accounts.find(x=>x.id===d.copy);const credential=d.login?credentialsOf(a).find(c=>c.id===d.login):undefined;if(d.login&&!credential)return;copy(d.field==='target'?(a.ip||a.host||a.url):(credential||a)[d.field],a,d.field,credential);}if(d.eye){const scope=d.eye+(d.login?':'+d.login:'');visible.has(scope)?visible.delete(scope):visible.add(scope);render();if($('#account-detail').open)refreshDetail();Array.from(document.querySelectorAll('[data-eye]')).find(x=>x.dataset.eye===d.eye&&(x.dataset.login||'')===(d.login||''))?.focus();}if(d.editAccount){$('#account-detail').close();}if(d.editAccount)openEditor('account',d.editAccount);if(d.editRoute)openEditor('route',d.editRoute);if(d.open){const a=data.accounts.find(x=>x.id===d.open);try{const u=new URL(a.url);if(!['https:','http:'].includes(u.protocol))throw Error();window.open(u.href,'_blank','noopener,noreferrer');}catch{toast('http:// または https:// で始まるURLを入力してください');}}if(d.deleteAccount){
 const account=data.accounts.find(a=>a.id===d.deleteAccount);if(!account)return;
 const refs=data.routes.filter(r=>r.steps.includes(account.id));
 const downstream=refs.some(r=>r.steps.indexOf(account.id)<r.steps.length-1);
 const message='「'+account.name+'」を削除しますか？'+(refs.length?'\n関連する経路も自動で整理します。':'')+(downstream?'\nこの接続先より先への経路は解除します。後続の接続先情報は残り、ほかに経路がなければ「経路未設定」に表示します。':'');
 if(confirm(message)){$('#account-detail').close();removeAccount(account.id);save();render();toast('「'+account.name+'」を削除しました');}
}if(d.deleteRoute&&confirm('この経路を削除しますか？ 接続先の情報は残ります。')){data.routes=data.routes.filter(r=>r.id!==d.deleteRoute);save();render();}if(d.move){const row=b.parentElement;if(d.move==='up'&&row.previousElementSibling)row.before(row.previousElementSibling);if(d.move==='down'&&row.nextElementSibling)row.after(row.nextElementSibling);}if('removeStep'in d)b.parentElement.remove();if(b.id==='step-add')addStep(data.accounts[0]?.id);if(b.id==='form-eye'){const el=$('[name="password"]');el.type=el.type==='password'?'text':'password';b.textContent=el.type==='password'?'表示':'隠す';}});
$('#edit-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);if(editing.kind==='branch'){if(!addBranch(editing.branch,f.get('target'),f.get('note'))){toast('この接続先はすでにつながっています');return;}save();render();$('#editor').close();toast('接続先を追加しました');return;}const item=Object.fromEntries(f);const source=item.source;delete item.source;if(editing.kind==='account'){item.credentials=readCredentials(f);for(const key of ['credential-id','credential-account','credential-username','credential-password'])delete item[key];Object.assign(item,{account:item.credentials[0].account,username:item.credentials[0].username,password:item.credentials[0].password});}item.name=item.name.trim();if(!item.name){toast('名前を入力してください');return;}if(editing.kind==='account'){if(item.url){try{const u=new URL(item.url);if(!['https:','http:'].includes(u.protocol))throw Error();}catch{toast('URLは http:// または https:// から入力してください');return;}}}else{item.steps=f.getAll('step');delete item.step;if(!item.steps.length){toast('接続先を1つ以上追加してください');return;}}item.id=editing.id||crypto.randomUUID();const list=editing.kind==='account'?data.accounts:data.routes;const i=list.findIndex(x=>x.id===item.id);if(i>=0)list[i]=item;else list.push(item);if(editing.kind==='account'&&editing.id)setAccountSource(item.id,source);save();render();$('#editor').close();toast('保存しました');});
$('#detail-close').onclick=()=>{$('#account-detail').close();hideDetailPasswords();};$('#account-detail').addEventListener('close',()=>{hideDetailPasswords();});
$('#edit-toggle').onchange=e=>{editMode=e.target.checked;render();};$('#add-route').onclick=()=>{if(!data.accounts.length){toast('先に接続先を追加してください');return;}openEditor('route');};$('#close-dialog').onclick=$('#cancel-dialog').onclick=()=>$('#editor').close();
$('#category-add').onclick=()=>{const name=prompt('新しい環境名');if(!name?.trim())return;if(data.categories.includes(name.trim())){toast('同じ名前のカテゴリがあります');return;}data.categories.push(name.trim());category=name.trim();save();render();};
$('#category-edit').onclick=()=>{const target=prompt('名前を変更する環境を入力してください。\n'+data.categories.join(' / '))?.trim();if(!target||!data.categories.includes(target))return;const name=prompt('環境名を変更',target)?.trim();if(!name||name===target)return;if(data.categories.includes(name)){toast('同じ名前のカテゴリがあります');return;}data.categories=data.categories.map(x=>x===target?name:x);for(const x of [...data.accounts,...data.routes])if(x.category===target)x.category=name;if(closedEnvironments.delete(target))closedEnvironments.add(name);save();render();};
$('#export').onclick=()=>download('access-note-'+new Date().toLocaleDateString('sv-SE')+'.json',JSON.stringify(data,null,2),'application/json');$('#import').onclick=()=>$('#import-file').click();$('#import-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const next=normalizeData(JSON.parse(await file.text()));validate(next);if(!confirm(`接続先 ${next.accounts.length}件・経路 ${next.routes.length}件を復元します。現在のデータを置き換えますか？`))return;data=next;category='';visible.clear();save();render();toast('復元しました');}catch(err){toast('復元できません：'+err.message);}finally{e.target.value='';}};
render();if(!storageOK){$('#save-status').textContent='保存データを要確認';if($('#storageLabel'))$('#storageLabel').textContent='読み込みに失敗しました';}
</script>
